name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Least privilege at workflow scope. The build matrix below runs
# `cargo build --all-features`, which executes every dependency `build.rs` in the
# graph — a write-scoped GITHUB_TOKEN in scope of that step hands arbitrary
# third-party build scripts the ability to push releases. The token is granted
# only to the `publish` job, which consumes an already-built artifact.
permissions:
  contents: read

# Two rapid tag pushes must not race two publish jobs.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: audio-engine-linux
          - os: macos-latest
            artifact_name: audio-engine-macos
          - os: windows-latest
            artifact_name: audio-engine-windows

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install ALSA (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        # `--locked`: a release must be built from the committed Cargo.lock.
        # Without it a semver-compatible dependency release silently changes
        # what ships, and the lockfile's reproducibility guarantee is void.
        run: cargo build --workspace --release --all-features --bins --locked

      - name: Package binaries (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging dist
          cp target/release/audio-engine-cli staging/
          cp target/release/replaygain-scanner staging/
          cp target/release/engine-tui staging/
          cp target/release/release-qualification staging/ 2>/dev/null || \
            echo "note: release-qualification not built (needs all optional features)"
          (cd staging && tar -czf "../dist/${{ matrix.artifact_name }}-${{ github.ref_name }}.tar.gz" *)

      - name: Package binaries (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p staging dist
          cp target/release/audio-engine-cli.exe staging/
          cp target/release/replaygain-scanner.exe staging/
          cp target/release/engine-tui.exe staging/
          cp target/release/release-qualification.exe staging/ 2>/dev/null || \
            echo "note: release-qualification not built (needs all optional features)"
          (cd staging && tar -czf "../dist/${{ matrix.artifact_name }}-${{ github.ref_name }}.tar.gz" *)
          if command -v 7z >/dev/null 2>&1; then
            (cd staging && 7z a "../dist/${{ matrix.artifact_name }}-${{ github.ref_name }}.zip" *)
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ github.ref_name }}
          path: dist/*
  publish:
    name: Publish to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: audio-engine-*-${{ github.ref_name }}
          merge-multiple: true

      # A checksum manifest so a downloaded artifact can be verified against
      # something other than the same host that produced it. Previously the
      # publish step globbed the build job's working directory instead of
      # consuming a named artifact, so nothing tied the published bits to the
      # built bits.
      - name: Generate checksum manifest
        run: |
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          token: ${{ secrets.GITHUB_TOKEN }}
