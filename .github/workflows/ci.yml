# Continuous integration for the `audio-engine` workspace.
#
# The job split is not arbitrary — it follows a measured property of this
# repository discovered while establishing the baseline:
#
#   **The full test suite is green in `--release` and RED in debug.**
#
# Five suites assert wall-clock or allocation-*rate* properties that a
# debug build cannot meet, because the DSP runs unoptimised:
#
#   | Suite                        | Debug   | Release |
#   |------------------------------|---------|---------|
#   | producer_tick_allocations    | ~40-55  | ~7      |
#   | realtime_qualification       | 88% CPU | pass    |
#   | long_duration_stress         | 1453 x  | pass    |
#   | long_duration_realtime_qual. | 6814 x  | pass    |
#   | headless_playback            | timing  | pass    |
#
# (Allocations per tick: the 2-second telemetry gate in `engine/tick.rs:190`
# is TIME-based, so an unoptimised tick loop crosses it far more often per
# tick than an optimised one, and each crossing costs ~106 allocations.)
#
# Encoding that as `--release` for the whole suite is the honest fix. The
# alternative — forcing `--test-threads=1` or raising thresholds to make debug
# pass — would hide real regressions behind a slower build, and a test that
# passes for the wrong reason is worse than one that fails. So: `test` runs
# `--release`, which is also the configuration a release is actually built in.
#
# `lint` still runs debug, because clippy and rustfmt are profile-independent.
#
# Two jobs are deliberately NOT `continue-on-error`, and their failures are
# meant to block a merge:
#   * `fixtures` — the generated decode corpus, which is the only coverage of
#     the externally-encoded lossy/container decode paths.
#   * `perf`     — the realtime wall-clock budget gate.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Debug assertions OFF globally so an accidental `cargo test` without
  # `--release` in a script behaves like the release suite instead of
  # producing a confusing wall-clock failure. Individual jobs still choose
  # their profile explicitly.
  RUSTFLAGS: -D warnings
  # The in-tree `.cargo/config.toml` pins `jobs = 2` for low-end hardware.
  # That is right for a developer's machine and wrong for CI, which should
  # use every core it was given.
  CARGO_BUILD_JOBS: 4

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint ───────────────────────────────────────────────────────────────────
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # NOTE: `RUSTFLAGS: -D warnings` is set workflow-wide, so the explicit
      # `-D warnings` below is redundant for clippy but kept for the case
      # where this file is run locally without the env var.
      - name: clippy (workspace, all targets)
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Optional-feature builds. AGENTS.md's completeness checklist requires
      # these to compile when the change touches their paths; compiling them
      # unconditionally is cheaper than working out which change did.
      #
      # `asio-native` / `wasapi-native` are `#[cfg(windows)]` and compile as
      # no-ops here — the Windows legs of `test` are where they actually build.
      - name: clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  # ── Feature combinations ───────────────────────────────────────────────────
  #
  # The `clippy` and `test` jobs only ever build `default` and `all-features`.
  # That hid two real build breaks:
  #
  #   * `src/lib.rs` gated `pub mod engine` on `audio-output` while
  #     `commands`, `source`, `diagnostics` and the prelude all referenced
  #     `crate::engine::*` unconditionally, so every minimal-feature build
  #     failed with a dozen unrelated "cannot find module `engine`" errors;
  #   * a stray `#[cfg(not(feature = "codec-opus"))] false` made the
  #     `Codec::Opus` capability tuple 13 elements instead of 12, so *any*
  #     build without `codec-opus` failed to compile.
  #
  # Both are fixed, but a matrix is what keeps a third one from appearing.
  features:
    name: feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Install ALSA
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: Swatinem/rust-cache@v2

      # `audio-output` alone must work: it implies `resample` because
      # `output::endpoint` drives a rubato slip resampler for drift correction.
      - name: check (audio-output only)
        run: cargo check --workspace --no-default-features --features audio-output

      # `audio-output` without any codec.
      - name: check (audio-output, no codecs)
        run: cargo check --workspace --no-default-features --features audio-output,all-codecs

      # Each optional backend family composes through `audio-output`.
      - name: check (tag-write + c-ffi + plugin-dylib)
        run: cargo check --workspace --no-default-features --features audio-output,tag-write,c-ffi,plugin-dylib

      - name: check (network-streaming + fingerprint + sofa-import)
        run: cargo check --workspace --no-default-features --features audio-output,network-streaming,fingerprint,sofa-import

      # `--no-default-features` alone must FAIL FAST with the explanatory
      # `compile_error!` in `lib.rs`, not with a cascade of unresolved-import
      # errors from backend internals.
      - name: check (no default features fails with the documented message)
        run: |
          if cargo check --workspace --no-default-features 2>&1 | tee /tmp/out | grep -q "the \`audio-output\` feature is required"; then
            echo "OK: the required-feature guard fired with its explanatory message"
          else
            echo "FAIL: --no-default-features did not produce the documented compile_error!"
            cat /tmp/out
            exit 1
          fi

  # ── Supply chain ───────────────────────────────────────────────────────────
  #
  # There was no dependency-policy or advisory check in CI, and `Cargo.lock`
  # carries 27 crates at two versions each.
  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo deny (advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: cargo audit (RustSec advisories)
        run: |
          cargo install cargo-audit --locked
          cargo audit

      # Dependency versions are floating (`"5.0"`, not `"=5.0.0"`), so a
      # resolution change is invisible in the diff. This makes one fail loudly.
      - name: lockfile is up to date
        run: |
          cargo update --locked --workspace
          if ! git diff --quiet -- Cargo.lock crates/opus-decoder/Cargo.lock; then
            echo "FAIL: Cargo.lock changed; dependency versions are floating, so a"
            echo "resolution change needs to be reviewed and committed deliberately."
            git diff --stat -- Cargo.lock
            exit 1
          fi

  # ── MSRV ───────────────────────────────────────────────────────────────────
  #
  # `crates/opus-decoder` requires edition 2024 (Rust 1.85). The root manifest
  # declared no `rust-version`, so an older toolchain failed with an opaque
  # edition error rather than a stated minimum.
  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (MSRV)
        run: |
          rustup toolchain install 1.85 --profile minimal
          rustup default 1.85

      - name: Install ALSA
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: Swatinem/rust-cache@v2

      - name: check (MSRV)
        run: cargo check --workspace --locked

  # ── Test ───────────────────────────────────────────────────────────────────
  test:
    name: test (${{ matrix.os }}, ${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Any single failing leg fails the job, but do not cancel in-flight legs:
      # a macOS failure plus a cancelled Windows run tells you much less than
      # both results.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        features: [default, all-features]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # Linux needs ALSA headers for `cpal`; the engine does not open a device
      # in CI, but the crate still links against `libasound`.
      - name: Install ALSA (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.features }}

      - name: test (release)
        run: |
          if [ "${{ matrix.features }}" = "all-features" ]; then
            cargo test --workspace --release --all-features --no-fail-fast
          else
            cargo test --workspace --release --no-fail-fast
          fi

      # The fixture smoke test skips itself when `testdata/fixtures/` is
      # absent, so the corpus is built in a dedicated job rather than here.
      # This is intentional: it keeps the `test` matrix from depending on
      # GStreamer being installed, which is not true on every runner image.

  # ── Fixtures ───────────────────────────────────────────────────────────────
  fixtures:
    name: decode fixture corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # The encoders the generator needs, verified present on GStreamer 1.24.x.
      # `aiffenc`, `avenc_pcm_s16be` and `adtsmux` are absent upstream and the
      # script routes around all three; see scripts/make_fixtures.sh.
      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad

      - uses: Swatinem/rust-cache@v2

      - name: Generate fixtures + manifest
        run: ./scripts/make_fixtures.sh

      - name: Verify corpus decodes to the manifest
        run: cargo test --release --test decode_fixture_smoke -- --nocapture

      # The manifest is committed. If the corpus no longer decodes to it, the
      # failure above says so. This step catches the other direction: a
      # regenerated corpus that no longer matches a committed manifest is a
      # change to record explicitly in review, not something to absorb.
      - name: Check the committed manifest is unchanged
        run: |
          if ! git diff --quiet -- testdata/fixtures.toml; then
            echo "::error::testdata/fixtures.toml changed. The recorded decode"
            echo "::error::expectations drifted from the committed manifest."
            echo "::error::Review the diff, then commit it deliberately."
            git --no-pager diff -- testdata/fixtures.toml
            exit 1
          fi

      - name: Upload corpus (for debugging a failed run)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: decode-fixtures
          path: testdata/fixtures/
          retention-days: 7

  # ── Realtime performance budget ────────────────────────────────────────────
  perf:
    name: realtime budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: perf

      # A wall-clock assertion is meaningless in a debug build — see the header
      # comment. `--release` is not optional here.
      - name: realtime budget (release)
        run: cargo test --release --test realtime_budget -- --nocapture

  # ── Docs ───────────────────────────────────────────────────────────────────
  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      # No `RUSTDOCFLAGS` deny here: intra-doc-link warnings are noisy across
      # 460 files and would block every PR. Broken *code* in a doc example is
      # caught by the doctest run inside the `test` job.
      - name: cargo doc
        run: cargo doc --workspace --no-deps

  # ── Fuzz ───────────────────────────────────────────────────────────────────
  #
  # There was no fuzz job, so `cargo fuzz` was only ever run by hand. The two
  # targets that existed also had a shape problem this fixes:
  #
  #   * `fuzz_codecs` stopped at `Decoder::open`, so every frame-decode path
  #     (TTA Rice/filter, DSD block reading and decimation, WavPack
  #     `load_block`, APE `decode_frame`, Opus packet decode) was unfuzzed —
  #     they all sit downstream of `decode_next`. It now drives decode, bounded
  #     by a block count and a wall-clock budget.
  #   * its temp filename was PID-only, so parallel `-jobs` workers collided
  #     in the shared `/tmp`.
  #   * playlist parsing (M3U / PLS / XSPF) — a hand-rolled parser on
  #     explicitly untrusted input — had NO target at all. It now does.
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_codecs, fuzz_parsers, fuzz_playlists]
    steps:
      - uses: actions/checkout@v4

      # cargo-fuzz needs nightly for its sanitizer/arbitrary plumbing.
      - name: Install nightly
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly

      - name: Install ALSA
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-${{ matrix.target }}

      # A short bounded run: enough to smoke the target on every PR without
      # turning CI into a fuzzing farm. Longer campaigns belong on a scheduled
      # job, not a per-push one.
      - name: cargo fuzz (60s smoke run)
        working-directory: fuzz
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=60 -rss_limit_mb=2560

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
          retention-days: 7
