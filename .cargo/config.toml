# Custom Cargo Configuration tuned for Low-End Systems
# Hardware Profile: Intel Core i3 (4 threads), 8 GB RAM, 1 TB Mechanical HDD
# Primary Goal: Prevent Out-Of-Memory (OOM) freezing, stop HDD swap thrashing,
#               and keep the OS and IDE fully responsive during builds.

[build]
# Limit concurrent compilation jobs to 2 (default is 4 logical cores).
# - Reserves 2 CPU threads so the desktop environment, browser, and IDE never freeze.
# - Cuts peak compiler RAM usage by ~50%, preventing Linux from swapping onto the HDD.
jobs = 2

[target.x86_64-unknown-linux-gnu]
rustflags = [
    # Use the bundled LLD linker instead of GNU ld. LLD is significantly faster
    # and consumes a fraction of the RAM during linking.
    "-C", "link-arg=-fuse-ld=lld",
]


[term]
progress.when = "auto"

[alias]
# Fast workspace type & syntax check (avoids linking and gigabytes of HDD writes)
c = "check --workspace"

# Workspace check for library and binaries only (skips dev-dependencies/benches)
check-fast = "check --workspace --bins --lib"

# Workspace build respecting jobs = 2
b = "build"

# Test execution with limited worker threads (prevents concurrent test harness OOM)
t = "test -- --test-threads=2"

# Sequential test execution for minimal memory usage
t-seq = "test -- --test-threads=1"
