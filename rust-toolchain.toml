# The one toolchain this repository is built and tested with.
#
# WHY THIS FILE, AND WHY `stable`
# --------------------------------
# Before this file existed, CI hardcoded `rustup toolchain install 1.85` in the
# `msrv` job while every other job installed `stable`, and no local developer
# tool was pinned at all. Local and CI toolchains were unrelated by
# construction: nothing tied the toolchain that produced a green test run to
# the toolchain that produced a green build on a laptop.
#
# `stable` is what the workspace is actually written against, and saying so
# beats pinning a number the code does not honour.
#
# MSRV AND DEPENDENCY FLOORS
# ---------------------------
# The workspace declares `rust-version = "1.98"` across all member manifests.
# The dependency floor imposed by transitive dependencies (e.g. `lofty`, `ratatui`)
# is 1.89, and Rust 1.98 serves as the verified MSRV building cleanly across
# all targets with `-D warnings` and `--locked`.
#
# Jobs that deliberately want something else (`nightly` for fuzzing and miri)
# select it with the `RUSTUP_TOOLCHAIN` environment variable or a
# `+toolchain` argument, both of which take precedence over this file. That is
# deliberate: the override is visible in the workflow diff rather than implied.

[toolchain]
channel = "stable"
# `minimal` skips `rust-docs` and the extra std sources, which is most of the
# download. `rustfmt` and `clippy` are named here because the `lint` job needs
# both on whichever toolchain rustup resolves, and CI should never depend on a
# component that happens to be preinstalled on a runner image.
components = ["rustfmt", "clippy"]
profile = "minimal"

# The standard libraries for every platform CI builds, so a `cargo check` for
# another target does not have to download a toolchain mid-job. This mirrors
# the `test` job's matrix exactly:
#
#   ubuntu-latest  -> x86_64-unknown-linux-gnu
#   macos-latest   -> aarch64-apple-darwin  (Apple Silicon runners)
#   windows-latest -> x86_64-pc-windows-msvc
#
# These are `targets`, not full toolchains: rustup installs only the `std` for
# each, which is small. Adding a platform here means adding it to the `test`
# matrix too — a `targets` entry nobody builds against is only download time.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]