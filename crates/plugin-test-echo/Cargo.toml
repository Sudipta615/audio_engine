[package]
name = "plugin-test-echo"
version = "0.9.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Sudipta615/ultimate-engine"
description = "Reference plugin for the Shadow Desktop plugin ABI: delay+gain, C-ABI vtable, no-panic audio path"
readme = "../../README.md"
keywords = ["audio", "dsp", "plugin"]
categories = ["multimedia::audio"]
# A test fixture, not a distributed artifact.
publish = false


[dependencies]
plugin-abi = { path = "../plugin-abi", version = "0.9.0", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = []
# The worst-case allocation-noise plugin used by the realtime fidelity
# suite: `process` internally allocates so the host's zero-allocation
# assertion can prove it CATCHES offenders.
worst-case = []
# Enable serde state save/restore (mirrors plugin-abi's serde-types).
serde-types = ["dep:serde", "plugin-abi/serde-types"]

[lib]
crate-type = ["rlib", "cdylib"]
