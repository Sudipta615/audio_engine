[package]
name = "config"
version = "0.8.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Sudipta615/ultimate-engine"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# The engine's own headless CLI and TUI both read a config file, and the
# loader belongs next to the model it deserializes rather than in a binary.
toml = "0.8"

[dev-dependencies]
serde_json = "1.0"
