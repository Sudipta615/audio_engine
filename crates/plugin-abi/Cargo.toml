[package]
name = "plugin-abi"
version = "0.9.1"
rust-version = "1.98"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Sudipta615/ultimate-engine"
description = "Shadow Desktop plugin ABI: versioned C-ABI vtables for pure-Rust effect plugins"
readme = "../../README.md"
documentation = "https://docs.rs/plugin-abi"
keywords = ["audio", "dsp", "plugin", "abi", "c-abi"]
categories = ["multimedia::audio", "api-bindings"]
# The one crate in this workspace that IS publishable: it is standalone
# (optional `serde` + `libloading` only) and carries no path dependencies,
# so it can be released independently of the engine. CI dry-runs
# `cargo publish -p plugin-abi` as a packaging check.


[features]
default = ["host"]
# Dynamic library loading for the host (dlopen / LoadLibrary). Pure-plugin
# builds (like the reference echo plugin) turn this off to stay tiny.
host = ["dep:libloading"]
# Serialize the descriptor/state types (save/restore travels as serde JSON).
serde-types = ["dep:serde"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
libloading = { version = "0.8", optional = true }
